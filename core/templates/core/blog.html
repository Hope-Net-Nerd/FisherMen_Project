{% extends "core/base.html" %}

{% load static %}

{% block head %}

<link rel="stylesheet" href="{% static 'core/style.css'%}"/>

{% endblock head %}
{% block title %}Publish | FisherMen{% endblock title %}
{% block content %}
<div class="form-container" style="max-width: 600px; margin: 40px auto; padding: 20px;">
    <h2>Write a Blog</h2>
    
    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="title" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Title</label>
            <input type="text" name="title" id="title" placeholder="Enter post title..." required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="content" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Content</label>
            <textarea name="content" id="content" rows="6" placeholder="What is on your mind?" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;"></textarea>
        </div>

        <button type="submit" class="button">Publish Post</button>
    </form>
</div>
{% endblock content %}
