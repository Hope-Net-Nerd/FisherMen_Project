{% extends "core/base.html" %}
{% load static %}

{% block head %}

<link rel="stylesheet" href="{% static 'core/style.css'%}"/>

{% endblock head %}

{% block content %}

<div class="login-container">
    <h2>Edit Post</h2>
    <form method="post" action="{% url 'edit_media' media.pk %}" enctype="multipart/form-data">
        {% csrf_token %}
        
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ media.title }}" required>
        <label for="content">Content</label>
        <textarea id="content" name="content" rows="6" style="width:100%; border-radius:12px; padding:12px;" required>{{ media.content }}</textarea>
        <button type="submit" class="button" style="margin-top:1rem;">Save Changes</button>
    </form>
</div>

{% endblock %}
